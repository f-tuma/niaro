nodeLinker: hoisted
packages:
  - apps/server-admin
  - apps/server-agent
overrides:
  "@storybook/react-native-ui": "10.4.0"
  "@storybook/react-native-ui-common": "10.4.0"
  "@storybook/react-native-theming": "10.4.0"
  "@storybook/react": "10.4.0"
  # Development-only inspector that loads its UI from a CDN; never installed.
  "@openuidev/devtools": "-"
allowBuilds:
  # Its postinstall sends installation telemetry.
  "@openuidev/lang-core": false
  esbuild: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - nodemailer@10.0.12
  - "@mastra/core@1.74.0"
  - "@mastra/libsql@1.25.0"
  - "@mastra/memory@1.35.0"
  - "@ai-sdk/gateway@4.0.103"
  - ai@7.0.127
  - '@aws-sdk/checksums@3.1002.0'
  - '@aws-sdk/client-s3@3.1160.0'
  - '@aws-sdk/core@3.979.0'
  - '@aws-sdk/credential-provider-env@3.972.79'
  - '@aws-sdk/credential-provider-http@3.972.81'
  - '@aws-sdk/credential-provider-ini@3.973.24'
  - '@aws-sdk/credential-provider-login@3.972.86'
  - '@aws-sdk/credential-provider-node@3.972.91'
  - '@aws-sdk/credential-provider-process@3.972.79'
  - '@aws-sdk/credential-provider-sso@3.973.23'
  - '@aws-sdk/credential-provider-web-identity@3.972.85'
  - '@aws-sdk/middleware-sdk-s3@3.972.84'
  - '@aws-sdk/nested-clients@3.997.53'
  - '@aws-sdk/token-providers@3.1160.0'
  - '@smithy/core@3.38.0'
  - '@smithy/node-http-handler@4.14.0'
  - '@smithy/signature-v4@5.7.5'
