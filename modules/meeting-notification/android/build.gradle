plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'dev.agentclient.meetingnotification'
version = '0.1.0'

android {
  namespace "dev.agentclient.meetingnotification"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

repositories {
  mavenCentral()
}

dependencies {
  implementation 'androidx.core:core-ktx:1.15.0'
  implementation 'androidx.media:media:1.7.0'
}
