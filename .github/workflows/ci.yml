name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      STORYBOOK_DISABLE_TELEMETRY: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.2"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run admin:build
      - run: python3 -m unittest discover -s scripts/audio -p 'test_*.py' -v
      - run: pnpm exec expo install --check
      - run: pnpm run build
      - run: pnpm run storybook:export
      - run: AUDIO_SPIKE=1 pnpm exec expo export --platform all --output-dir dist-audio
