name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not include secrets, customer data or real conversations. Report security issues privately (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: A minimal reproduction with synthetic data.
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Assistant app (iOS / Android / web)
        - Server console
        - Server / API
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Revision, OS, Node version, device or browser, relevant profile settings with secrets removed.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log output with secrets removed.
      render: text
