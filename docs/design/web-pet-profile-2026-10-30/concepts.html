const i=n=>icons[n]||'';
const b=(n,label)=>`<button class="icon" aria-label="${label}">${i(n)}</button>`;
const button=(text,cls='')=>`<button class="button ${cls}">${text}</button>`;
const sw=label=>`<button class="switch" role="switch" aria-checked="true" aria-label="${label}"></button>`;
const menuItems=[['LayoutGrid','Overview'],['SquarePen','New chat'],['Search','Search'],['gap',''],['ListTodo','Tasks'],['AudioLines','Meetings'],['Workflow','Processes'],['Sparkles','Skills'],['PlugZap','Connections'],['PetOutline','Pet']];
document.getElementById('sidebar').innerHTML=`<div class="brand"><div class="brand-mark">${logo}</div><div><strong>Studio</strong><small>Workspace</small></div></div><nav class="nav">${menuItems.map(([icon,label])=>icon==='gap'?'<div class="gap"></div>':`<a href="#" class="${(screen==='newchat'&&label==='New chat')||((screen==='profile'||screen==='settings')&&label==='Pet')?'selected':''}">${i(icon)}${label}</a>`).join('')}</nav><div><div class="recent">Recent</div><nav class="nav"><a href="#" class="${screen==='conversation'?'selected':''}">${i('FileText')}Project review</a><a href="#">${i('FileText')}Weekly planning</a></nav></div><div class="account"><span class="avatar">AN</span><span>Alex Novak</span>${b('ChevronsUpDown','Account')}</div>`;
const observation=(section,text,open=false)=>`<div class="observation"><div class="obs-heading"><div class="obs-content"><small>${section}</small><p>${text}</p></div>${b(open?'ChevronUp':'ChevronRight','Sources')}${b('MoreHorizontal','Memory actions')}</div>${open?`<div class="sources"><div class="source-row"><a href="#">From chat</a><time>24 Oct</time></div><div class="source-row"><span class="source-meta">Last seen yesterday</span>${button('Correct')}</div></div>`:''}</div>`;

let openedSection=query.get('section')||'';
let selectedView=query.get('view')||'observed';
let personalScope=false;
const sections=[['work','Work','BriefcaseBusiness'],['projects','Projects','Workflow'],['tools','Tools','Wrench'],['people','People','UsersRound'],['style','Style','MessageSquare'],['rhythm','Rhythm','Clock3']];
const demoRows={work:['You coordinate the Studio design reviews.'],projects:['You are preparing the Studio website.'],tools:['You use Figma for interface work.'],people:[],style:['You prefer a short summary with next steps.','You like clear action lists.'],rhythm:[]};
function profile(){
 const expanded=!!openedSection&&selectedView==='observed';
 const header=`<header class="page-header"><span class="mobile-menu">${b('Menu','Navigation')}</span><h1>You and Niaro</h1><div class="actions"><a class="text-icon" href="?screen=settings&theme=${light?'light':'dark'}" aria-label="Settings">${i('Settings2')}<span>Settings</span></a>${b('MoreHorizontal','Page actions')}</div></header>`;
 const tabs=`<nav class="profile-tabs" aria-label="Profile views">${[['observed','Observed'],['saved','Saved'],['about','About you']].map(([value,label])=>`<a href="?screen=profile&view=${value}&theme=${light?'light':'dark'}" class="${selectedView===value?'active':''}" ${selectedView===value?'aria-current="page"':''}>${label}</a>`).join('')}<span class="profile-tab-spacer"></span><div class="memory-controls">${selectedView==='observed'?`<select class="scope-select" aria-label="Observation scope"><option ${!personalScope?'selected':''}>Work observations</option><option ${personalScope?'selected':''}>Personal observations</option></select>`:''}<div class="setting"><span>Use memory</span>${sw('Use memory')}</div></div></nav>`;
 let content='';
 if(selectedView==='observed'){
  const stage=`<section class="central-stage ${expanded?'expanded':''}" aria-label="Observed sections"><div class="central-pet"><img src="${pet}" alt="Bublina, the existing Niaro pet"><h2>Bublina</h2>${button('Appearance')}</div>${sections.map(([key,label,icon])=>`<button id="section-${key}" class="section-node node-${key} ${openedSection===key?'selected':''}" data-section="${key}" aria-expanded="${openedSection===key}" aria-controls="profile-detail">${i(icon)}<span>${label}</span>${i('ChevronRight')}</button>`).join('')}</section>`;
  const rows=personalScope?[]:(demoRows[openedSection]||[]);
  const detail=expanded?`<section id="profile-detail" class="profile-detail" aria-labelledby="detail-title"><button class="detail-back" data-return>${i('ArrowLeft')}All sections</button><div class="detail-heading"><h2 id="detail-title" tabindex="-1">${sections.find(s=>s[0]===openedSection)?.[1]||''}</h2></div>${rows.length?rows.map((text,index)=>observation('',text,index===0)).join(''):'<p class="section-empty">Nothing observed here yet.</p>'}</section>`:'<div id="profile-detail"></div>';
  content=stage+detail;
 }else if(selectedView==='saved')content=`<section class="profile-info"><img class="info-pet" src="${pet}" alt="Bublina"><div class="section-head"><h2>Saved</h2><a href="#" class="muted">Manage memories</a></div><div class="saved-row"><div><p>Keep replies short and practical.</p><small>You added</small></div>${b('MoreHorizontal','Saved memory actions')}</div></section>`;
 else content=`<section class="profile-info"><img class="info-pet" src="${pet}" alt="Bublina"><div class="section-head"><h2>About you</h2>${b('Pencil','Edit position')}</div><dl class="position"><dt>Job title</dt><dd>Product designer</dd><dt>Department</dt><dd>Studio</dd></dl><small>Confirmed by you</small></section>`;
 return `<div class="centered-profile">${header}${tabs}${content}</div>`;
}
function bindProfile(){
 document.querySelectorAll('[data-section]').forEach(button=>button.addEventListener('click',()=>{openedSection=button.dataset.section;renderProfile();const target=document.getElementById('detail-title');target?.focus({preventScroll:true});target?.scrollIntoView({block:'nearest',behavior:'instant'});}));
 document.querySelector('[data-return]')?.addEventListener('click',()=>{const from=openedSection;openedSection='';renderProfile();document.getElementById('section-'+from)?.focus({preventScroll:true});});
 document.querySelector('.scope-select')?.addEventListener('change',e=>{personalScope=e.target.selectedIndex===1;renderProfile();document.querySelector('.scope-select').focus();});
}
function renderProfile(){document.getElementById('main').innerHTML=profile();bindProfile();}

const composer=(filled=false)=>`<div class="composer-wrap">${!filled?`<div class="clip-menu"><button>${i('FileText')}Add file</button><button>${i('ClipboardList')}Reference task</button></div>`:''}<div class="composer">${filled?`<div class="chips"><span class="chip">${i('FileText')}website-brief.pdf${i('X')}</span><span class="chip">${i('ClipboardList')}Review first concepts${i('X')}</span></div>`:''}<p class="${filled?'':'muted'}">${filled?'Turn these into a short checklist.':'Message the assistant'}</p><div class="composer-tools"><button class="icon ${filled?'':'active'}" aria-label="Add attachment or task">${i('Paperclip')}</button>${b('AtSign','Reference a skill, process or service')}<span class="spacer"></span>${b('Mic','Voice')}<button class="icon send ${filled?'':'disabled'}" aria-label="Send">${i('ArrowUp')}</button></div></div></div>`;
const chatHeader=(filled=false)=>`<header class="page-header chat-header"><span class="mobile-menu">${b('Menu','Navigation')}</span><span class="icon collapse">${i('PanelLeftClose')}</span>${filled?`<a class="pet-mini" href="?screen=profile" aria-label="Open your pet and memory"><img src="${pet}" alt=""></a>`:''}<h1>${filled?'Project review':'New chat'}</h1><div class="actions">${b('MoreHorizontal','Chat options')}</div></header>`;
const conversation=()=>`${chatHeader(true)}<div class="chat-body conversation"><div class="user-message">Summarize the next steps for the Studio website.</div><p class="assistant-line">Three things to settle before Friday.</p><section class="result"><div class="result-header"><h2>Studio website</h2>${b('Maximize2','Expand result')}</div><table><thead><tr><th>Next step</th><th>Owner</th><th>Due</th></tr></thead><tbody><tr><td>Confirm page structure</td><td>Alex</td><td>Tomorrow</td></tr><tr><td>Review first concepts</td><td>Mira</td><td>Thursday</td></tr><tr><td>Prepare handoff</td><td>Alex</td><td>Friday</td></tr></tbody></table></section><div class="citation">From Project review${b('Copy','Copy result')}</div></div>${composer(true)}`;
document.getElementById('main').innerHTML=screen==='newchat'?`${chatHeader()}<div class="new-intro"><img src="${pet}" alt="Bublina, the existing Niaro pet"><h1>What can I help with?</h1></div>${composer()}`:screen==='conversation'?conversation():profile();
if(screen==='profile')bindProfile();
if(screen==='settings')document.getElementById('overlay').innerHTML=`<div class="scrim"></div><section class="sheet" aria-label="Settings"><header class="sheet-header"><h1>Settings</h1></header><section class="section"><h2>Memory</h2><div class="setting"><span>Use memory</span>${sw('Use memory')}</div><div class="setting"><span>Keep personal observations</span>${sw('Keep personal observations')}</div><div class="setting"><a href="#">Manage memories</a>${b('MoreHorizontal','Memory actions')}</div></section><section class="section"><h2>Companion</h2><div class="setting"><span>Animate pet</span>${sw('Animate pet')}</div><div class="setting"><span>Show in chat</span>${sw('Show in chat')}</div><div class="setting"><span>Weather</span><button class="text-icon">City: Prague ${i('ChevronRight')}</button></div></section><section class="section"><h2>Voice</h2><div class="setting"><span>Output voice</span><button class="text-icon">Server default ${i('ChevronRight')}</button></div></section></section><footer class="sheet-footer"><a class="button" href="?screen=profile&theme=${light?'light':'dark'}">Done</a></footer>`;
</script></body></html>
