# Optional object-storage adds private RustFS with its own persistent volume.
# Bootstrap explicitly; see docs/guides/object-storage.md.
# Niaro: one server container, one data volume, optional Caddy for HTTPS.
# See docs/guides/deployment.md.
#
#   Local trial (HTTP on this machine only):
#     docker compose up -d --build
#     open http://localhost:8793/
#   Production behind HTTPS:
#     NIARO_PUBLIC_URL=https://assistant.example.com docker compose --profile https up -d --build
#   Optional speaker diarization (who spoke when; see docs/guides/deployment.md):
#     HF_TOKEN=... docker compose --profile diarization up -d --build
#   then turn it on in administration, Settings, Meetings. Leaving the
#   profile out (or removing the diarizer service) switches it off.
#   Optional reading of attached documents and photos (docs/guides/object-storage.md):
#     NIARO_CONVERTER_URL=http://converter:8000 docker compose --profile documents up -d --build
#   Optional web search without an outside key (docs/guides/deployment.md):
#     docker compose --profile search up -d --build
#   then add SearXNG at http://searxng:8080 in administration, Search backends.
#
# Settings come from the environment or an `.env` file next to this file
# (NIARO_PUBLIC_URL, NIARO_CONFIG, NIARO_DATA_VOLUME, SMTP_*).
name: niaro

x-object-storage-environment: &object-storage-environment
  NIARO_S3_ENDPOINT: ${NIARO_S3_ENDPOINT:-}
  NIARO_S3_REGION: ${NIARO_S3_REGION:-}
  NIARO_S3_BUCKET: ${NIARO_S3_BUCKET:-}
  NIARO_S3_PREFIX: ${NIARO_S3_PREFIX:-}
  NIARO_S3_CREDENTIAL_MODE: ${NIARO_S3_CREDENTIAL_MODE:-}
  NIARO_S3_ACCESS_KEY_ID: ${NIARO_S3_ACCESS_KEY_ID:-}
  NIARO_S3_SECRET_ACCESS_KEY: ${NIARO_S3_SECRET_ACCESS_KEY:-}
  NIARO_S3_SESSION_TOKEN: ${NIARO_S3_SESSION_TOKEN:-}
  NIARO_S3_ACCESS_KEY_ID_FILE: ${NIARO_S3_ACCESS_KEY_ID_FILE:-}
  NIARO_S3_SECRET_ACCESS_KEY_FILE: ${NIARO_S3_SECRET_ACCESS_KEY_FILE:-}
  NIARO_S3_SESSION_TOKEN_FILE: ${NIARO_S3_SESSION_TOKEN_FILE:-}
  NIARO_S3_FORCE_PATH_STYLE: ${NIARO_S3_FORCE_PATH_STYLE:-}
  NIARO_S3_ALLOW_HTTP: ${NIARO_S3_ALLOW_HTTP:-}

services:
  niaro:
    build: .
    image: ${NIARO_IMAGE:-niaro:local}
    init: true
    restart: unless-stopped
    environment:
      <<: *object-storage-environment
      # The one public origin people open. HTTPS in production; the default is
      # only for a trial on this machine.
      NIARO_PUBLIC_URL: ${NIARO_PUBLIC_URL:-http://localhost:8793}
      # Count sign-in limits per real client behind Caddy. "auto" trusts the
      # proxy only with an HTTPS public URL (the https profile); the HTTP local
      # trial has no proxy. Set 0 if the server port is reachable another way.
      NIARO_TRUST_PROXY: ${NIARO_TRUST_PROXY:-auto}
      # Optional: only these proxy addresses (IPs or CIDR) are trusted.
      NIARO_TRUSTED_PROXIES: ${NIARO_TRUSTED_PROXIES:-}
      # Agent runs at once across everyone (one per person, plus a hub refresh).
      NIARO_MAX_CONCURRENT_RUNS: ${NIARO_MAX_CONCURRENT_RUNS:-8}
      # Optional invitation mail. Without SMTP, administrators copy links.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # Optional: the token the diarizer service expects (its DIARIZER_TOKEN).
      NIARO_DIARIZATION_TOKEN: ${DIARIZER_TOKEN:-}
      # Attachments in chat; they need object storage (NIARO_S3_*).
      NIARO_ATTACHMENTS_ENABLED: ${NIARO_ATTACHMENTS_ENABLED:-false}
      # Optional: installed connectors' runtime (auto, docker, process) and
      # 0 to make plugin files read-only in administration.
      NIARO_HOSTED_RUNTIME: ${NIARO_HOSTED_RUNTIME:-}
      NIARO_PLUGIN_EDITING: ${NIARO_PLUGIN_EDITING:-}
      # Optional: the converter that reads attachments (profile "documents"),
      # http://converter:8000, and the token it expects (its CONVERTER_TOKEN).
      NIARO_CONVERTER_URL: ${NIARO_CONVERTER_URL:-}
      NIARO_CONVERTER_TOKEN: ${CONVERTER_TOKEN:-}
    volumes:
      - niaro-data:/data
      - ${NIARO_CONFIG:-./examples/self-hosted/server.json}:/config/server.json:ro
    # Loopback only: other machines reach the server through Caddy.
    ports:
      - "127.0.0.1:8793:8793"
    networks: [default, documents]
    # Hardened: read-only root filesystem (the server writes only to /data and
    # /tmp), no Linux capabilities, no privilege gain through setuid binaries.
    read_only: true
    tmpfs:
      # Meeting audio is decoded here in short pieces, a few meetings at once.
      - /tmp:size=512m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 30s
    mem_limit: 2g
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  # Optional attachment storage; bootstrap explicitly before starting Niaro.
  rustfs:
    profiles: ["object-storage"]
    image: rustfs/rustfs:1.0.4@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${NIARO_RUSTFS_ROOT_ACCESS_KEY:-}
      RUSTFS_SECRET_KEY: ${NIARO_RUSTFS_ROOT_SECRET_KEY:-}
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_OBS_LOG_DIRECTORY: /tmp/logs
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        case "$$RUSTFS_ACCESS_KEY" in ''|rustfsadmin|minioadmin|admin) echo 'Invalid RustFS bootstrap credentials' >&2; exit 64;; esac
        case "$$RUSTFS_SECRET_KEY" in ''|rustfsadmin|minioadmin|password) echo 'Invalid RustFS bootstrap credentials' >&2; exit 64;; esac
        [ "$${#RUSTFS_ACCESS_KEY}" -ge 8 ] && [ "$${#RUSTFS_SECRET_KEY}" -ge 16 ] || exit 64
        exec /entrypoint.sh rustfs
    volumes:
      - rustfs-data:/data
    networks: [default]
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports: ["127.0.0.1:${NIARO_RUSTFS_PORT:-19010}:9000"]

  rustfs-bootstrap:
    profiles: ["object-storage"]
    image: ${NIARO_IMAGE:-niaro:local}
    build:
      context: .
    command: ["storage-bootstrap"]
    restart: "no"
    depends_on:
      rustfs: { condition: service_started }
    environment:
      <<: *object-storage-environment
      NIARO_RUSTFS_ROOT_ACCESS_KEY: ${NIARO_RUSTFS_ROOT_ACCESS_KEY:-}
      NIARO_RUSTFS_ROOT_SECRET_KEY: ${NIARO_RUSTFS_ROOT_SECRET_KEY:-}
      NIARO_RUSTFS_ROOT_ACCESS_KEY_FILE: ${NIARO_RUSTFS_ROOT_ACCESS_KEY_FILE:-}
      NIARO_RUSTFS_ROOT_SECRET_KEY_FILE: ${NIARO_RUSTFS_ROOT_SECRET_KEY_FILE:-}
    networks: [default]
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # Optional: who spoke when, reached by Niaro at http://diarizer:8000.
  # Nemotron 3 Diarization by default (model in the image, no token);
  # DIARIZER_DOCKERFILE=Dockerfile.pyannote builds the slower pyannote one.
  diarizer:
    profiles: ["diarization"]
    build:
      context: ./services/diarizer
      dockerfile: ${DIARIZER_DOCKERFILE:-Dockerfile}
    image: ${DIARIZER_IMAGE:-niaro-diarizer:local}
    restart: unless-stopped
    environment:
      # pyannote only: a Hugging Face token whose account accepted the terms
      # of pyannote/speaker-diarization-community-1 (read access is enough).
      HF_TOKEN: ${HF_TOKEN:-}
      # Shared with Niaro (NIARO_DIARIZATION_TOKEN); optional on a private
      # network, recommended.
      DIARIZER_TOKEN: ${DIARIZER_TOKEN:-}
      # CPU threads; 0 uses up to eight.
      DIARIZER_THREADS: ${DIARIZER_THREADS:-0}
    # pyannote keeps its downloaded model here; Nemotron carries its own.
    volumes:
      - diarizer-models:/models
    read_only: true
    tmpfs:
      # Nemotron reads the recording from a file: two hours is about 230 MB.
      - /tmp:size=320m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # A two-hour meeting: about 1.5 GB with Nemotron, 2 GB plus the model
    # with pyannote.
    mem_limit: ${DIARIZER_MEMORY:-4g}
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  # Optional: reads attached documents and photos for the assistant, reached
  # by Niaro at http://converter:8000 on a network with no way out. Docling by
  # default; CONVERTER_DOCKERFILE=Dockerfile builds the lighter MarkItDown one.
  converter:
    profiles: ["documents"]
    build:
      context: ./services/converter
      dockerfile: ${CONVERTER_DOCKERFILE:-Dockerfile.docling}
    image: ${CONVERTER_IMAGE:-niaro-converter:local}
    restart: unless-stopped
    environment:
      # Shared with Niaro (NIARO_CONVERTER_TOKEN); recommended.
      CONVERTER_TOKEN: ${CONVERTER_TOKEN:-}
      CONVERTER_TIMEOUT_SECONDS: ${CONVERTER_TIMEOUT_SECONDS:-600}
      # CPU threads for Docling's models.
      CONVERTER_THREADS: ${CONVERTER_THREADS:-2}
    networks: [documents]
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    # Docling reads a 100-page scan in about 1.5 GB; MarkItDown needs 0.5 GB.
    mem_limit: ${CONVERTER_MEMORY:-3g}
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  # Optional: a private SearXNG for web searches, reached by Niaro at
  # http://searxng:8080 on the project's own network; no published port and
  # no key. Add it in administration, Providers, Search backends, then pick it
  # in Models, Settings, Web search.
  searxng:
    profiles: ["search"]
    build:
      context: ./services/searxng
    image: ${SEARXNG_IMAGE:-niaro-searxng:local}
    restart: unless-stopped
    environment:
      # Optional; a random one is made at each start when empty.
      SEARXNG_SECRET: ${SEARXNG_SECRET:-}
    networks: [default]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: ${SEARXNG_MEMORY:-512m}
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  caddy:
    profiles: ["https"]
    image: caddy:2.11-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    restart: unless-stopped
    depends_on:
      niaro:
        condition: service_healthy
    environment:
      NIARO_PUBLIC_URL: ${NIARO_PUBLIC_URL:-}
      NIARO_UPSTREAM: niaro:8793
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./examples/self-hosted/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

networks:
  default:
  # Only Niaro and the converter: parsers of uploaded files reach nothing else.
  documents:
    internal: true

volumes:
  rustfs-data:
  niaro-data:
    # Restore into a new volume and point this at it to switch over.
    name: ${NIARO_DATA_VOLUME:-niaro-data}
  caddy-data:
  caddy-config:
  # The diarization model (about 30 MB), downloaded on the first start.
  diarizer-models:
